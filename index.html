<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Code Blocks</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <div class="app-shell">
            <button id="theme-toggle" class="theme-toggle" type="button">Dark mode</button>
            <aside class="toolbox">
                <div class="toolbox-header">
                    <h1>Blocks</h1>
                    <div class="toolbox-actions">
                        <button id="load-bubble-btn" type="button">Bubble sort</button>
                        <button id="run-program-btn" type="button">Run</button>
                    </div>
                </div>
                <div class="toolbox-body">
                    <nav id="category-list"></nav>
                    <div id="flyout"></div>
                </div>
                <div class="toolbox-output">
                    <pre id="run-output"></pre>
                </div>
            </aside>
            <main class="workspace">
                <div id="workspace-canvas"></div>
            </main>
        </div>
    </body>
</html>
